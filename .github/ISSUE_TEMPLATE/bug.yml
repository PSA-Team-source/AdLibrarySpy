name: Bug report
description: A wrong number, a broken screen or a crash
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - adlibraryspy.com (web app)
        - A self-hosted instance
        - Chrome extension
        - MCP (Claude, ChatGPT, Cursor…)
        - shopify-inspect CLI
    validations: { required: true }
  - type: input
    id: url
    attributes: { label: Page URL, command or tool call, placeholder: "https://adlibraryspy.com/shops?… or npx shopify-inspect somestore.com" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened vs. what you expected
      description: For a wrong number, say where you saw the right one. Screenshots help.
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Browser / Node version and OS, placeholder: "Chrome 140, macOS 15 — or node 22.18" }
