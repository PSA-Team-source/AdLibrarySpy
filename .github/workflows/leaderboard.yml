name: Weekly leaderboard
on:
  schedule:
    - cron: "0 14 * * 5"   # Fridays 14:00 UTC, after the weekly report publishes
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: leaderboard, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node leaderboard/update.mjs
      - name: Commit if changed
        run: |
          git add README.md leaderboard
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "leaderboard: $(node -p "require('./leaderboard/latest.json').week")"
          git push
